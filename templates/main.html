<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="128x128" href="{% get_media_prefix %}icon/Studyroom.png?v=3" />
    <script>
      try {
        const savedTheme = window.localStorage.getItem("study-room-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        console.warn("The saved theme preference could not be read.", error);
      }
    </script>
    <link rel="stylesheet" href="{% static 'styles/style.css' %}?v=5" />
    <title>StudyRoom - Find study partners around the world!</title>
  </head>

  <body>
    
    {% include 'navebar.html'%}
     {% if messages %}
 <ul class="messages ">
    {% for messages in messages %}
    <li>{{messages}}</li>
    
    {% endfor %}
 </ul>
  
 {% endif %}

    {% block content %}


    {% endblock  %}
   
    <script src="{% static 'js/script.js' %}?v=3"></script>
  </body>
</html>
